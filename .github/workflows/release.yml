name: Release

# Publishing a GitHub release for a pushed version tag lets the Zenodo integration archive it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
