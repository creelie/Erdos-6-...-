name: Release

# Publishing a GitHub release lets the Zenodo integration archive it and mint a DOI.
# The release is made either by pushing a version tag or by running this workflow by hand
# (Actions > Release > Run workflow), which creates the tag at the chosen branch's head.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create and release
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        # A release made on the GitHub website pushes its tag too; leave that release as it is.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file "RELEASE_NOTES_${TAG}.md"
          fi
